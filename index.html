  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Un éditeur de sites par blocs, gratuit et open source. Créez votre page et exportez son HTML, sans compte ni dépendance."
    />
    <meta name="theme-color" content="#25634c" />
    <title>bloclibre — vos idées, votre site.</title>
    <link

    />
    <style>
      /* bloclibre — Interface de l’éditeur. Licence MIT. Aucune ressource distante. */
:root {
  --ink: #24332d;
  --muted: #7c847f;
  --green: #28684f;
  --green-dark: #1e523d;
  --mint: #eef4e9;
  --line: #e8eae5;
  --paper: #fff;
  --surface: #f7f8f5;
  --accent: #caf19d;
  --radius: 9px;
  --shadow: 0 18px 70px #1b34251a;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: var(--ink);
  font-size: 13px;
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--surface);
}
button,
input,
textarea,
select {
  font: inherit;
}
button,
a,
input,
textarea,
select {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
button {
  color: inherit;
}
button:disabled {
  cursor: default;
  opacity: 0.32;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 3px;
}
button {
  border: 0;
  background: none;
}
a {
  color: inherit;
}
svg.icon {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
  vertical-align: middle;
  stroke-width: 1.7;
}
button svg {
  pointer-events: none;
}
button span {
  pointer-events: none;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
[hidden] {
  display: none !important;
}
.app {
  height: 100dvh;
  min-height: 420px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.app-header {
  height: 73px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 21px;
  padding: 0 24px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  z-index: 30;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  flex-shrink: 0;
}
.brand-symbol {
  width: 31px;
  height: 31px;
  background: var(--green);
  padding: 8px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
  border-radius: 8px;
  transform: rotate(-3deg);
}
.brand-symbol i {
  display: block;
  background: #d9edc9;
  border-radius: 1px;
}
.brand-symbol i:nth-child(4) {
  background: #a3c791;
  border-radius: 1px 1px 4px 1px;
}
.brand-word {
  font-size: 22px;
  font-weight: 750;
  letter-spacing: -1.05px;
}
.brand-word > span {
  color: var(--green);
}
.header-divider {
  width: 1px;
  height: 25px;
  background: var(--line);
  flex-shrink: 0;
}
.project-heading {
  display: flex;
  align-items: center;
  position: relative;
  gap: 2px;
  min-width: 0;
}
.project-heading input {
  border: 0;
  background: none;
  font-weight: 600;
  color: #414c45;
  font-size: 13px;
  width: 140px;
  max-width: 180px;
  padding: 7px 3px;
  outline-offset: 0;
  border-radius: 4px;
}
.project-heading input:hover {
  background: #f7f8f5;
}
.icon-button {
  width: 33px;
  height: 33px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: #778079;
}
.icon-button:hover:not(:disabled) {
  background: #f1f3ef;
  color: var(--ink);
}
.icon-button .icon {
  width: 18px;
  height: 18px;
}
.save-status {
  font-size: 11px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.save-status i {
  width: 5px;
  height: 5px;
  background: #78a286;
  border-radius: 50%;
}
.save-status.saving i {
  background: #c8a961;
}
.save-status.error i {
  background: #c9705d;
}
.header-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.history-buttons {
  display: flex;
  gap: 1px;
}
.actions-divider {
  margin: 0 5px;
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 15px;
  min-height: 38px;
  border-radius: 7px;
  font-weight: 600;
  font-size: 12px;
  text-decoration: none;
  transition:
    background 0.15s,
    transform 0.15s;
  white-space: nowrap;
}
.button:active:not(:disabled) {
  transform: translateY(1px);
}
.button-primary {
  background: var(--green);
  color: #fff;
  border: 1px solid var(--green);
}
.button-primary:hover {
  background: var(--green-dark);
}
.button-light {
  background: white;
  border: 1px solid #e0e4dd;
}
.button-light:hover {
  background: #f5f7f2;
}
.button-ghost {
  background: #f2f5ef;
  color: var(--green);
}
.button-ghost:hover {
  background: #e7eee0;
}
.button-danger {
  background: #fff0ed;
  color: #a44134;
}
.button-danger:hover {
  background: #fce4de;
}
.button .icon {
  width: 16px;
  height: 16px;
}
.button-small {
  font-size: 11px;
  min-height: 30px;
  padding: 6px 10px;
}
.button-full {
  width: 100%;
}
.editor-layout {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 256px minmax(0, 1fr) 278px;
}
.left-sidebar,
.right-sidebar {
  min-height: 0;
  background: #fff;
  display: flex;
  flex-direction: column;
  z-index: 20;
}
.left-sidebar {
  border-right: 1px solid var(--line);
}
.right-sidebar {
  border-left: 1px solid var(--line);
}
.sidebar-tabs {
  height: 58px;
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid var(--line);
  padding: 0 18px;
  gap: 21px;
  flex-shrink: 0;
}
.sidebar-tab {
  display: flex;
  gap: 7px;
  align-items: center;
  border-bottom: 2px solid transparent;
  font-size: 12px;
  font-weight: 550;
  color: #8b918c;
  position: relative;
  padding: 0 3px;
}
.sidebar-tab .icon {
  width: 16px;
  height: 16px;
}
.sidebar-tab.active {
  color: var(--green);
  border-bottom-color: var(--green);
}
.library-content {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 21px 18px 20px;
  scrollbar-width: thin;
  scrollbar-color: #d9ded5 transparent;
}
.block-library-title {
  margin: 0 0 5px;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -0.35px;
}
.library-subtitle {
  font-size: 11px;
  line-height: 1.55;
  color: #91978f;
  margin: 0 0 18px;
}
.search-field {
  position: relative;
  margin-bottom: 14px;
}
.search-field > svg {
  position: absolute;
  left: 11px;
  top: 10px;
  width: 15px;
  height: 15px;
  color: #8f978f;
}
.search-field input {
  width: 100%;
  border: 1px solid #e7eae3;
  background: #fafbf8;
  padding: 10px 31px 10px 33px;
  border-radius: 6px;
  color: var(--ink);
  font-size: 11px;
  outline-offset: 1px;
}
.search-field input::placeholder {
  color: #a0a69c;
}
.search-key {
  position: absolute;
  right: 10px;
  top: 10px;
  font-size: 10px;
  color: #a0a69c;
  border: 1px solid #e4e8de;
  border-radius: 3px;
  line-height: 14px;
  width: 13px;
  text-align: center;
}
.filter-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-bottom: 23px;
}
.filter-chip {
  padding: 5px 8px;
  font-size: 10px;
  border-radius: 5px;
  color: #90968d;
}
.filter-chip:hover {
  background: #f6f7f3;
}
.filter-chip.active {
  background: #edf3e8;
  color: var(--green);
  font-weight: 600;
}
.block-group {
  margin-bottom: 24px;
}
.block-group h3 {
  margin: 0 0 10px;
  color: #9a9f97;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.1px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.block-group h3 span {
  height: 1px;
  width: 42px;
  background: #f0f1ed;
}
.block-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.block-card {
  height: 77px;
  border: 1px solid #e8ebe4;
  border-radius: 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  background: #fff;
  transition:
    border-color 0.15s,
    background 0.15s,
    transform 0.15s;
  position: relative;
  cursor: grab;
}
.block-card:active {
  cursor: grabbing;
}
.block-card:hover {
  border-color: #95b39a;
  background: #f6f9f2;
  transform: translateY(-1px);
}
.block-card > .icon {
  height: 23px;
  width: 23px;
  color: #667362;
  stroke-width: 1.5;
}
.block-card > span {
  font-size: 10px;
  color: #687262;
  font-weight: 500;
}
.block-card .card-add {
  position: absolute;
  right: 6px;
  top: 5px;
  color: var(--green);
  opacity: 0;
  font-size: 15px;
}
.block-card:hover .card-add {
  opacity: 1;
}
.no-results {
  padding: 30px 5px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}
.sidebar-bottom {
  padding: 14px 15px 15px;
  border-top: 1px solid var(--line);
  background: #fff;
  flex-shrink: 0;
}
.template-promo {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #f2f5ec;
  border: 1px solid #eaf0e3;
  border-radius: 8px;
  padding: 13px 10px;
  width: 100%;
  text-align: left;
}
.template-promo:hover {
  background: #eaf0e1;
}
.promo-icon {
  width: 30px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #789368;
}
.template-promo strong {
  font-size: 10px;
  font-weight: 650;
  display: block;
  margin-bottom: 5px;
}
.template-promo small {
  font-size: 9px;
  color: #8c9881;
  display: block;
}
.template-promo > span:last-child {
  margin-left: auto;
  color: #92a184;
}
.template-promo > span:last-child .icon {
  width: 14px;
}
.open-source-note {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  color: #a0a599;
  font-size: 9px;
  padding-top: 14px;
}
.open-source-note .icon {
  width: 12px;
  height: 12px;
}
.workspace {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: #f3f4f0;
  position: relative;
}
.workspace-bar {
  height: 58px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 26px;
  border-bottom: 1px solid #e4e7df;
  background: #f9faf7;
  gap: 8px;
}
.workspace-location {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 11px;
  white-space: nowrap;
}
.page-tag {
  font-size: 8px;
  letter-spacing: 0.6px;
  color: #929d89;
  border: 1px solid #e0e6d8;
  border-radius: 3px;
  padding: 3px 4px;
  line-height: 1;
}
.workspace-location strong {
  font-size: 11px;
  font-weight: 550;
  color: #4d5b4c;
}
.workspace-location-dot,
.draft-label {
  font-size: 10px;
  color: #a1a69d;
}
.device-switch {
  display: flex;
  gap: 2px;
  padding: 3px;
  background: #edefe9;
  border: 1px solid #e8ebe2;
  border-radius: 7px;
}
.device-switch button {
  width: 31px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #9ca394;
  border-radius: 4px;
}
.device-switch button .icon {
  width: 15px;
  height: 15px;
}
.device-switch button.active {
  color: #46623c;
  background: #fff;
  box-shadow: 0 1px 4px #20351812;
}
.device-switch button:hover:not(.active) {
  color: #56634e;
}
.workspace-tools {
  display: flex;
  align-items: center;
  gap: 7px;
}
.zoom-button {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 10px;
  color: #90998a;
}
.zoom-button .icon {
  width: 13px;
  height: 13px;
}
.canvas-scroll {
  flex: 1;
  overflow: auto;
  padding: 26px 34px 18px;
  scrollbar-width: thin;
  scrollbar-color: #cdd5c6 transparent;
  background-image: radial-gradient(#cdd3c159 0.65px, transparent 0.65px);
  background-size: 12px 12px;
  position: relative;
}
.canvas-intro {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  font-size: 9px;
  color: #9da496;
  max-width: 1120px;
  margin: 0 auto 14px;
  letter-spacing: 0.1px;
}
.canvas-document-name {
  display: flex;
  gap: 7px;
  align-items: center;
}
.tiny-dot {
  height: 5px;
  width: 5px;
  border-radius: 50%;
  background: #97ab8d;
}
.canvas-frame-wrap {
  margin: 0 auto;
  background: #fff;
  box-shadow:
    0 3px 9px #293b2410,
    0 22px 65px #293b240c;
  position: relative;
  border-radius: 3px;
  transition: width 0.15s;
  outline: 1px solid #e1e6d9;
  overflow: visible;
  min-height: 200px;
}
#editor-frame {
  border: 0;
  display: block;
  transform-origin: top left;
  background: #fff;
  border-radius: 3px;
  overflow: hidden;
  position: absolute;
  top: 0;
  left: 0;
}
.selection-toolbar {
  display: flex;
  align-items: center;
  gap: 3px;
  min-height: 37px;
  width: max-content;
  max-width: 100%;
  border: 1px solid #e0e5d8;
  background: #fff;
  border-radius: 7px;
  box-shadow: 0 2px 5px #263b1f06;
  padding: 3px 5px;
  margin: 0 auto 15px;
  position: relative;
  z-index: 2;
}
.selection-toolbar .selected-type {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  font-weight: 600;
  padding: 0 8px;
  color: #54674a;
  white-space: nowrap;
}
.selection-toolbar .selected-type .icon {
  width: 14px;
  height: 14px;
}
.selection-toolbar .toolbar-rule {
  width: 1px;
  height: 16px;
  background: #e7eadf;
  margin: 0 4px;
}
.selection-toolbar .icon-button {
  width: 28px;
  height: 27px;
}
.selection-toolbar .icon-button .icon {
  width: 14px;
  height: 14px;
}
.selection-toolbar .delete-block:hover {
  color: #ba5b49;
  background: #fff3ef;
}
.end-add-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px dashed #c5ceba;
  color: #8d9c80;
  font-size: 10px;
  border-radius: 5px;
  width: 100%;
  max-width: 1120px;
  padding: 12px;
  margin: 16px auto 0;
  background: #ffffff40;
}
.end-add-button:hover {
  border-color: #789a63;
  color: var(--green);
  background: #fff8;
}
.end-add-button .icon {
  width: 14px;
  height: 14px;
}
.canvas-footnote {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  font-size: 9px;
  color: #a2aa98;
  margin-top: 17px;
  text-align: center;
  line-height: 1.6;
}
.canvas-footnote .icon {
  width: 12px;
  height: 12px;
}
.workspace-footer {
  height: 31px;
  background: #fafbf8;
  border-top: 1px solid #e6eadf;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  font-size: 9px;
  color: #9ba590;
  gap: 10px;
  flex-shrink: 0;
}
.workspace-footer > span:first-child {
  display: flex;
  align-items: center;
  gap: 6px;
}
.footer-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #9ab588;
}
.workspace-footer button {
  font-size: 9px;
  display: flex;
  gap: 6px;
  align-items: center;
  color: #929f86;
}
.workspace-footer .icon {
  width: 13px;
  height: 13px;
}
.inspector-tabs {
  height: 58px;
  display: flex;
  align-items: stretch;
  gap: 25px;
  padding: 0 21px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.inspector-tabs > button:not(.close-panel) {
  padding: 0 5px;
  font-size: 12px;
  color: #929a8b;
  border-bottom: 2px solid transparent;
}
.inspector-tabs > button.active {
  color: var(--green);
  font-weight: 600;
  border-bottom-color: var(--green);
}
.inspector-content {
  overflow-y: auto;
  min-height: 0;
  flex: 1;
  scrollbar-width: thin;
  scrollbar-color: #dbe1d2 transparent;
}
.selected-block-heading {
  padding: 22px 21px 20px;
  display: flex;
  gap: 11px;
  align-items: center;
  border-bottom: 1px solid var(--line);
}
.selected-block-icon {
  height: 35px;
  width: 35px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f3f6ef;
  border: 1px solid #e8eee0;
  border-radius: 8px;
  color: #6b855c;
  flex-shrink: 0;
}
.selected-block-icon .icon {
  width: 20px;
  height: 20px;
}
.selected-block-heading h2 {
  font-size: 12px;
  margin: 0 0 5px;
  font-weight: 650;
}
.selected-block-heading p {
  font-size: 9px;
  color: #9ba390;
  line-height: 1.6;
  margin: 0;
}
.inspector-section {
  border-bottom: 1px solid var(--line);
  padding: 19px 21px;
}
.inspector-section > h3,
.inspector-section > summary {
  font-size: 11px;
  font-weight: 650;
  margin: 0 0 17px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  letter-spacing: -0.1px;
}
.inspector-section h3 .icon {
  width: 13px;
  height: 13px;
  color: #a3ac98;
}
.inspector-section summary {
  cursor: pointer;
  list-style: none;
  margin-bottom: 0;
}
.inspector-section summary::-webkit-details-marker {
  display: none;
}
.inspector-section[open] > summary {
  margin-bottom: 17px;
}
.inspector-section > summary::after {
  content: "+";
  color: #99a58c;

  gap: 8px;
  z-index: 500;
  pointer-events: none;
  max-width: calc(100vw - 30px);
}
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 17px;
  background: #233e2e;
  color: #e6f0de;
  border: 1px solid #617857;
  border-radius: 8px;
  box-shadow: 0 7px 30px #142e2230;
  font-size: 11px;
  animation: slide-in 0.2s ease;
  pointer-events: auto;
  line-height: 1.6;
}
.toast .icon {
  width: 15px;
  height: 15px;
  color: #bcdb9e;
  flex-shrink: 0;
}
.toast.error {
  background: #653a2d;
  border-color: #a07056;
  color: #fff3ec;
}
.toast .toast-undo {
  margin-left: 8px;
  color: #c9e5b2;
  font-size: 10px;
  text-decoration: underline;
  white-space: nowrap;
}
.empty-selection {
  padding: 40px 23px;
  text-align: center;
  color: #9eae8e;
  font-size: 11px;
  line-height: 1.9;
}
.empty-selection > .icon {
  width: 28px;
  height: 28px;
  display: block;
  margin: 0 auto 17px;
  color: #b4c4a3;
}
.empty-page-message {
  position: absolute;
  left: 0;
  right: 0;
  top: 60px;
  text-align: center;
  padding: 30px;
  color: #a0ad93;
  font-size: 13px;
  pointer-events: none;
}
.panel-scrim {
  position: fixed;
  inset: 73px 0 0;
  background: #15341d35;
  z-index: 35;
  backdrop-filter: blur(2px);
}
.noscript-message {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #f6f8f1;
  display: grid;
  place-items: center;
  padding: 40px;
  text-align: center;
  color: #436136;
  line-height: 1.8;
}
@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes slide-in {
  from {
    opacity: 0;
    transform: translateY(9px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

:root {
  --ink: #26372e;
  --muted: #7d887b;
  --green: #2d684f;
  --green-dark: #20553d;
  --line: #e5e9e0;
  --surface: #f3f5ef;
}
.editor-layout {
  grid-template-columns: 54px 272px minmax(0, 1fr) 286px;
}
.app-header {
  gap: 17px;
}
.brand {
  gap: 9px;
}
.brand-word {
  font-size: 21px;
}
.studio-brand-badge {
  font-size: 7px;
  letter-spacing: 1.1px;
  font-weight: 650;
  color: #79936b;
  background: #f0f5e9;
  border: 1px solid #e4ecd9;
  border-radius: 4px;
  padding: 4px 5px;
  margin-left: 0;
}
.studio-rail {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 14px 6px;
  background: #f8faf4;
  border-right: 1px solid var(--line);
  min-height: 0;
  z-index: 23;
  position: relative;
}
.studio-rail > button {
  width: 36px;
  height: 39px;
  min-height: 32px;
  border-radius: 8px;
  color: #8e9e82;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
}
.studio-rail > button > .icon {
  width: 19px;
  height: 19px;
  stroke-width: 1.65;
}
.studio-rail > button:hover {
  color: var(--green);
  background: #edf3e5;
}
.studio-rail > button.active {
  background: var(--green);
  color: #e5f3d7;
  box-shadow: 0 3px 8px #21482f16;
}
.studio-rail > button > span {
  display: none;
  position: absolute;
  left: 45px;
  background: #223e2b;
  color: #e5f1d9;
  font-size: 10px;
  padding: 8px 11px;
  border-radius: 5px;
  white-space: nowrap;
  box-shadow: 0 5px 20px #1c382522;
  z-index: 60;
  pointer-events: none;
}
.studio-rail > button:hover > span,
.studio-rail > button:focus-visible > span {

}
.rail-rule {
  width: 19px;

  background: #e1e9d8;
  margin: 3px 0 6px;

.rail-spacer {

  50% {

  }

  function safeUrl(value, fallback = "#") {
    const s = String(value || "").trim();
    if (!s) return fallback;
    if (
      /^(https?:\/\/|mailto:|tel:|#|\.\.?\/|\/(?!\/))/i.test(s) &&
      !/[\u0000-\u001f]/.test(s)
    )
      return s;
    if (/^[a-z0-9_-][a-z0-9_./-]*(?:[?#][^\s]*)?$/i.test(s)) return s;
    return fallback;
  }
  function safeImage(value) {
    const s = String(value || "").trim();
    if (/^data:image\/(png|jpeg|jpg|webp|gif|svg\+xml|avif)(;|,)/i.test(s))
      return s;
    if (
      (/^(https?:\/\/|\.\.?\/|\/(?!\/))/i.test(s) ||
        /^[a-z0-9_-][a-z0-9_./%-]*(?:[?#][^\s]*)?$/i.test(s)) &&
      !/[\u0000-\u001f\\]/.test(s)
    )
      return s;
    return PLACEHOLDER;
  }
  function sanitizeHtml(source) {
    const parsed = new DOMParser().parseFromString(String(source), "text/html");
    const tags = new Set(
      "div p a span em strong b i u s h1 h2 h3 h4 h5 h6 ul ol li blockquote cite br hr img section article header footer nav main table thead tbody tr th td figure figcaption pre code small mark details summary".split(
        " ",
      ),
    );
    const forbidden = new Set(
      "script style iframe object embed link meta base form input textarea select button template svg math".split(
        " ",
      ),
    );
    for (const el of [...parsed.body.querySelectorAll("*")].reverse()) {
      const tag = el.tagName.toLowerCase();
      if (forbidden.has(tag)) {
        el.remove();
        continue;
      }
      if (!tags.has(tag)) {
        el.replaceWith(...el.childNodes);
        continue;
      }
      for (const attr of [...el.attributes]) {
        const n = attr.name.toLowerCase();
        if (
          ![
            "href",
            "src",
            "alt",
            "title",
            "class",
            "id",
            "style",
            "width",
            "height",
            "target",
            "rel",
            "role",
            "aria-label",
            "colspan",
            "rowspan",
          ].includes(n)
        ) {
          el.removeAttribute(n);
          continue;
        }
        if (n === "href") el.setAttribute(n, safeUrl(attr.value));
        if (n === "src") el.setAttribute(n, safeImage(attr.value));
        if (n === "style") {
          const styles = attr.value
            .split(";")
            .filter(
              (rule) =>
                /^(text-align|color|background-color|padding(?:-[a-z]+)?|margin(?:-[a-z]+)?|font-size|font-weight|border(?:-[a-z]+)?|max-width|width)\s*:\s*[a-z0-9\s#.,%()\-]+$/i.test(
                  rule.trim(),
                ) && !/url|expression|import/i.test(rule),
            )
            .join(";");
          el.setAttribute(n, styles);
        }
        if (n === "target" && attr.value !== "_blank") el.removeAttribute(n);
      }
      if (el.getAttribute("target") === "_blank")
        el.setAttribute("rel", "noopener noreferrer");
    }
    return parsed.body.innerHTML;
  }
  function normalizeLegacyProject(raw) {
    if (!raw || typeof raw !== "object" || !Array.isArray(raw.blocks))
      throw new Error("Ce fichier n’est pas un projet bloclibre valide.");
    if (raw.version !== 1)
      throw new Error(
        "Version de projet non prise en charge. Utilisez un projet bloclibre v1.",
      );
    const d = baseDocument();
    d.title = String(raw.title || "Sans titre").slice(0, 80);
    d.description = String(raw.description || "").slice(0, 320);
    const s = raw.settings || {};
    d.settings = {
      font: Object.hasOwn(FONTS, s.font) ? s.font : "sans",
      accent: color(s.accent, d.settings.accent),
      background: color(s.background, d.settings.background),
      text: color(s.text, d.settings.text),
      width: clamp(s.width, 600, 1440, 1040),
    };

    const ids = new Set();
    function clean(b, depth) {
      if (!b || !Object.hasOwn(TYPES, b.type) || depth > 10 || ++count > 400)
        throw new Error(
          "Projet trop complexe ou bloc non reconnu (400 blocs et 10 niveaux maximum).",
        );
      const result = block(b.type);
      if (/^b-[a-z0-9-]{2,80}$/i.test(b.id || "") && !ids.has(b.id))
        result.id = b.id;
      ids.add(result.id);
      for (const [key, fallback] of Object.entries(result.props)) {
        const v = b.props?.[key];
        if (typeof fallback === "number")
          result.props[key] = clamp(
            v ?? fallback,
            key === "letterSpacing" ? -8 : 0,
            1600,
            fallback,
          );
        if (typeof fallback === "boolean" && typeof v === "boolean")
          result.props[key] = v;
        if (typeof fallback === "string" && typeof v === "string")
          result.props[key] = v.slice(
            0,
            ["src", "poster", "backgroundImage"].includes(key)
              ? 14000000
              : key === "images"
                ? 45000000
                : key === "html" || (key === "text" && b.type === "code")
                  ? 100000
                  : 12000,
          );
      }
      if (!["left", "center", "right"].includes(result.props.align))
        result.props.align = "left";
      result.props.color = color(result.props.color);
      result.props.background = color(result.props.background);
      result.props.anchor = result.props.anchor
        .replace(/[^a-z0-9_-]/gi, "")
        .slice(0, 80);
      if (
        "font" in result.props &&
        !["inherit", ...Object.keys(FONTS)].includes(result.props.font)
      )
        result.props.font = "inherit";
      if (b.type === "heading")
        result.props.level = clamp(Math.round(result.props.level), 1, 6, 2);
      if (b.type === "columns") {
        const kids = Array.isArray(b.children) ? b.children : [];
        if (kids.length > 4 || kids.some((child) => child?.type !== "section"))
          throw new Error(
            "Colonnes invalides : une à quatre sections sont attendues.",
          );
        result.children = kids.slice(0, 4).map((c) => clean(c, depth + 1));
        while (
          result.children.length <
          clamp(Math.round(result.props.count), 1, 4, 2)
        ) {
          if (depth >= 10 || ++count > 400)
            throw new Error(
              "Projet trop complexe : 400 blocs et 10 niveaux maximum.",
            );
          result.children.push(
            block("section", { paddingTop: 0, paddingBottom: 0 }),
          );
        }
        result.props.count = result.children.length;
      } else if (["section", "buttons"].includes(b.type))
        result.children = (Array.isArray(b.children) ? b.children : []).map(
          (c) => clean(c, depth + 1),
        );

    }

  }

/* Moteur de rendu Studio : un seul rendu pour l’édition, l’aperçu et la publication. */
const coreBlockStyle = blockStyle;
blockStyle = function (p) {
  const shadows = {
    none: "none",
    soft: "0 8px 28px #1633240b",
    medium: "0 16px 45px #16332416",
    large: "0 25px 75px #10271a22",
  };
  let css = coreBlockStyle(p);
  if (p.paddingX)
    css += `padding-left:${clamp(p.paddingX, 0, 300)}px;padding-right:${clamp(p.paddingX, 0, 300)}px;`;
  if (p.minHeight) css += `min-height:${clamp(p.minHeight, 0, 1200)}px;`;
  if (p.boxRadius) css += `border-radius:${clamp(p.boxRadius, 0, 150)}px;`;
  if (p.borderWidth)
    css += `border:${clamp(p.borderWidth, 0, 20)}px solid ${color(p.borderColor, "#dce2d6")};`;
  if (shadows[p.shadow] && p.shadow !== "none")
    css += `box-shadow:${shadows[p.shadow]};`;
  if (p.opacity !== undefined && p.opacity !== 100)
    css += `opacity:${clamp(p.opacity, 0, 100, 100) / 100};`;
  if (p.gradient)
    css += `background:linear-gradient(${clamp(p.gradientAngle, 0, 360, 135)}deg,${color(p.gradientStart, "#e7f1db")},${color(p.gradientEnd, "#f9f5ec")});`;
  if (p.backgroundImage) {
    const src = safeImage(p.backgroundImage).replace(
      /["\\\n\r]/g,
      (c) => "\\" + c,
    );
    css += `background-image:linear-gradient(#000000${Math.round(
      clamp(p.overlay, 0, 90) * 2.55,
    )
      .toString(16)
      .padStart(2, "0")},#000000${Math.round(clamp(p.overlay, 0, 90) * 2.55)
      .toString(16)
      .padStart(
        2,
        "0",
      )}),url("${src}");background-size:cover;background-position:center;`;
  }
  return css;
};
function renderLines(text) {
  return String(text || "")
    .split("\n")
    .filter(Boolean)
    .map((line) => line.split("|").map((s) => s.trim()));
}
function parsedGallery(p) {
  return renderLines(p.images).map(([src, alt, caption]) => ({
    src: safeImage(src),
    alt: alt || "",
    caption: caption || "",
  }));
}
function validSiteBase(raw) {
  try {
    const url = new URL(String(raw));
    if (!["http:", "https:"].includes(url.protocol)) return "";
    url.hash = "";
    url.search = "";
    return url.href.replace(/\/?$/, "/");
  } catch (error) {
    return "";
  }
}
function embeddedUrl(raw) {
  try {
    const url = new URL(raw);
    if (
      [
        "youtube.com",
        "www.youtube.com",
        "m.youtube.com",
        "youtu.be",
        "www.youtube-nocookie.com",
      ].includes(url.hostname)
    ) {
      const id =
        url.hostname === "youtu.be"
          ? url.pathname.slice(1)
          : url.searchParams.get("v") || url.pathname.split("/").at(-1);
      if (/^[a-z0-9_-]{11}$/i.test(id || ""))
        return `https://www.youtube-nocookie.com/embed/${id}`;
    }
    if (
      ["vimeo.com", "www.vimeo.com", "player.vimeo.com"].includes(url.hostname)
    ) {
      const id = url.pathname.split("/").filter(Boolean).at(-1);
      if (/^\d{4,15}$/.test(id || ""))
        return `https://player.vimeo.com/video/${id}`;
    }
  } catch (error) {}
  return "";
}

let studioDbPromise = null;
const sessionProjects = new Map();
const LOCAL_VAULT_PREFIX = `bloclibre.vault.v2:${PROJECT_SCOPE}::`;
function openStudioDb() {
  if (studioDbPromise) return studioDbPromise;
  studioDbPromise = new Promise((resolve, reject) => {
    if (!globalThis.indexedDB) {
      reject(new Error("IndexedDB indisponible"));
      return;
    }
    let settled = false;
    const timer = setTimeout(() => {
      if (!settled) {
        settled = true;
        reject(new Error("Le stockage ne répond pas."));
      }
    }, 5000);
    const request = indexedDB.open(DB_NAME, 2);
    request.onupgradeneeded = () => {
      const db = request.result;
      for (const name of ["projects", "revisions"])
        if (!db.objectStoreNames.contains(name))
          db.createObjectStore(name, { keyPath: "key" });
    };
    request.onsuccess = () => {
      if (settled) {
        request.result.close();
        return;
      }
      settled = true;
      clearTimeout(timer);
      const db = request.result;
      db.onversionchange = () => {
        db.close();
        studioDbPromise = null;
      };
      resolve(db);
    };
    const fail = (error) => {
      if (!settled) {
        settled = true;
        clearTimeout(timer);
        reject(error);
      }
    };
    request.onerror = () => fail(request.error);
    request.onblocked = () =>
      fail(new Error("Stockage verrouillé par un autre onglet."));
  });
  return studioDbPromise;
}
async function studioTransaction(storeName, mode, operation) {
  const db = await openStudioDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, mode),
      store = tx.objectStore(storeName);
    let result;
    const req = operation(store);
    if (req) req.onsuccess = () => (result = req.result);
    tx.oncomplete = () => resolve(result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error("Sauvegarde interrompue"));
  });
}
function vaultTransaction(mode, operation) {

  records.push(

function ratioColor(a, b) {
  const luminance = (hex) => {
    const c = color(hex, "#ffffff")
      .slice(1)
      .match(/../g)
      .map((n) => parseInt(n, 16) / 255)
      .map((n) => (n <= 0.04045 ? n / 12.92 : ((n + 0.055) / 1.055) ** 2.4));
    return c[0] * 0.2126 + c[1] * 0.7152 + c[2] * 0.0722;
  };
  const x = luminance(a),
    y = luminance(b);
  return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
}
function auditSite() {
  syncActivePage();
  const issues = [];
  let checked = 0;
  const published = doc.pages.filter(
      (p) => p.published || p.id === doc.homePageId,
    ),
    filenames = new Set(published.map((p) => pageFilename(p)));
  const add = (page, kind, title, detail, blockId = null) =>
    issues.push({ pageId: page.id, kind, title, detail, blockId });
  for (const p of published) {
    const blocks = allBlocks(p.blocks);
    checked += blocks.length;
    const h1 = blocks.filter(
      (b) => b.type === "heading" && b.props.level === 1,
    );
    if (h1.length !== 1)
      add(
        p,
        h1.length ? "warning" : "error",
        h1.length ? "Plusieurs titres H1" : "Ajoutez un titre principal H1",
        "Une page claire a généralement un seul titre principal.",
        h1[0]?.id,
      );
    if (!p.description || p.description.length < 45)
      add(
        p,
        "warning",
        "Une description à compléter",
        "Une phrase de 50 à 160 caractères aide à présenter cette page dans les moteurs de recherche.",
      );
    const anchors = new Set(["top", "main-content"]);
    let previousHeading = 0;
    let demo = false;
    for (const b of blocks) {
      const v = b.props;
      if (v.anchor) {
        if (anchors.has(v.anchor))
          add(
            p,
            "error",
            "Une ancre est utilisée plusieurs fois",
            `« ${v.anchor} » doit être unique sur la page.`,
            b.id,
          );
        anchors.add(v.anchor);
      }
      if (b.type === "heading") {
        if (!String(v.text).trim())
          add(
            p,
            "error",
            "Un titre est vide",
            "Ajoutez un titre ou retirez ce bloc.",
            b.id,
          );
        if (previousHeading && v.level > previousHeading + 1)
          add(
            p,
            "warning",
            "Un niveau de titre est sauté",
            `Le titre passe de H${previousHeading} à H${v.level}.`,
            b.id,
          );
        previousHeading = v.level;
      }
      if (
        ((b.type === "image" && !v.decorative) ||
          (b.type === "project" && v.src)) &&
        !v.alt.trim()
      )
        add(
          p,
          "warning",
          "Une image n’a pas de texte alternatif",
          "Décrivez son contenu, ou marquez-la comme décorative si elle l’est.",
          b.id,

          "warning",
          "Une vidéo attend son lien",
          "Renseignez un lien YouTube / Vimeo ou supprimez le bloc vide.",
          b.id,
        );
      if (b.type === "file" && !v.src)
        add(
          p,
          "warning",
          "Un document attend son fichier",
          "Importez votre CV / PDF ou renseignez son URL.",
          b.id,
        );
      if (b.type === "video" && !v.src)
        add(
          p,
          "warning",
          "Une vidéo attend son fichier",
          "Renseignez une URL MP4 / WebM.",
          b.id,
        );
      if (b.type === "contact" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email))
        add(
          p,
          "error",
          "Adresse de contact invalide",
          "Ajoutez votre vraie adresse email.",
          b.id,
        );
      if (
        ["heading", "paragraph", "button", "badge"].includes(b.type) &&
        v.color &&
        !v.gradient &&
        !v.backgroundImage
      ) {
        const ratio = ratioColor(
            v.color,
            v.background || doc.settings.background,
          ),
          threshold =
            v.fontSize >= 24 || (v.bold && v.fontSize >= 18) ? 3 : 4.5;
        if (ratio < threshold)
          add(
            p,
            "warning",
            "Contraste à vérifier",
            `Rapport indicatif ${ratio.toFixed(1)}:1. Visez au moins ${threshold}:1 pour ce texte.`,
            b.id,
          );
      }
      if (
        /example\.com|Votre prénom|à personnaliser avec votre histoire/i.test(
          JSON.stringify(v),
        )
      )
        demo = true;
      const links = [];
      if (v.href) links.push(v.href);
      if (b.type === "navigation" && !v.autoPages)
        links.push(...renderLines(v.text).map(([, h]) => h));
      if (b.type === "social")
        links.push(...renderLines(v.text).map(([, h]) => h));
      if (b.type === "footer")
        links.push(...renderLines(v.links).map(([, h]) => h));
      for (const href of links.filter(Boolean)) {
        if (href === "#") {
          add(
            p,
            "warning",
            "Un lien ne mène nulle part",
            "Remplacez le lien « # » par une page, une ancre ou une vraie URL.",
            b.id,
          );
          continue;
        }
        if (safeUrl(href, "") === "") {
          add(
            p,
            "error",
            "Lien non pris en charge",
            "Utilisez https://, mailto:, tel:, une ancre ou un fichier relatif.",
            b.id,
          );
          continue;
        }
        if (
          /^[^/#]+\.html(?:#.*)?$/.test(href) &&
          !filenames.has(href.split("#")[0])
        )
          add(
            p,
            "warning",
            "Une page liée n’est pas exportée",
            `Le lien « ${href} » ne correspond pas à une page publiée.`,
            b.id,
          );
      }
    }
    for (const b of blocks) {
      const v = b.props;
      const links = [];
      if (v.href?.startsWith("#")) links.push(v.href);
      if (b.type === "navigation" && !v.autoPages)
        links.push(
          ...renderLines(v.text)
            .map(([, h]) => h)
            .filter((h) => h?.startsWith("#")),
        );
      for (const href of links)
        if (href.length > 1 && !anchors.has(href.slice(1)))
          add(
            p,
            "warning",
            "Une ancre cible est introuvable",
            `Le bloc lié à « ${href} » n’existe pas sur cette page.`,
            b.id,
          );
    }
    if (demo)
      add(
        p,
        "warning",
        "Des contenus de démonstration restent présents",
        "Remplacez notamment les adresses example.com, les profils et les descriptions de démonstration.",
      );
  }
  let baseValid = false;
  try {
    baseValid = /^https?:$/.test(new URL(doc.settings.baseUrl).protocol);
  } catch (error) {}
  if (doc.settings.baseUrl && !baseValid)
    add(
      published[0],
      "warning",
      "L’URL publique semble invalide",
      "Renseignez l’adresse complète, par exemple https://pseudo.github.io/site/.",
    );
  const errors = issues.filter((i) => i.kind === "error").length,
    warnings = issues.length - errors;
  return {
    issues,
    errors,
    warnings,
    score: Math.max(0, 100 - errors * 12 - warnings * 3),
    pages: published.length,
    blocks: checked,
  };
}

function copySelectedBlock(cut = false) {
  const f = findBlock(selectedId);

  blockClipboard = deepClone(f.block);
  if (cut) deleteBlock();
  toast(
    cut
      ? "Bloc coupé. Ctrl / Cmd + V pour le placer."
      : "Bloc copié. Ctrl / Cmd + V pour le réutiliser.",
  );
}
function copySelectedStyle() {
  const f = findBlock(selectedId);
  if (!f) return;
  styleClipboard = Object.fromEntries(
    STYLE_KEYS.filter((k) => k in f.block.props).map((k) => [
      k,
      f.block.props[k],
    ]),
  );
  toast("Style copié. Ctrl / Cmd + Maj + V pour l’appliquer.");
}
function pasteSelectedStyle() {
  const f = findBlock(selectedId);
  if (!f || !styleClipboard) {
    toast("Copiez d’abord le style d’un bloc.", true);
    return;
  }
  commit(() => {
    for (const [k, v] of Object.entries(styleClipboard))
      if (k in f.block.props) f.block.props[k] = v;

}
function wrapSelectedBlock() {
  const f = findBlock(selectedId);

    flatten().length >= 400 ||
    insertionDepth(f.parentId) + subtreeDepth(f.block) + 1 > 10
  ) {
    toast(
      "Cette opération dépasserait la limite de blocs ou d’imbrication.",
      true,
    );

  }
  const container = block(
    "section",
    { name: "Groupe", paddingTop: 0, paddingBottom: 0, marginBottom: 0 },
    [f.block],

    () => {

  function clearDrop() {
    try {
      $$(
        ".bl-drop-before,.bl-drop-after,.bl-drop-inside",
        frame.contentDocument,
      ).forEach((el) =>
        el.classList.remove(
          "bl-drop-before",
          "bl-drop-after",
          "bl-drop-inside",
        ),
      );
    } catch (error) {
      /* chargement */
    }
    $$(".tree-row.drop-before,.tree-row.drop-after").forEach((el) =>
      el.classList.remove("drop-before", "drop-after"),
    );
    dropTarget = null;
  }
  function readDrag(event) {
    if (dragData) return dragData;
    try {
      const d = JSON.parse(event.dataTransfer.getData(MIME));
      return ["library", "structure"].includes(d.source) ? d : null;
    } catch (error) {
      return null;
    }
  }
  function onFrameDragOver(event) {
    if (!dragData && ![...event.dataTransfer.types].includes(MIME)) return;
    event.preventDefault();
    event.dataTransfer.dropEffect =
      dragData?.source === "library" ? "copy" : "move";
    clearDrop();
    const el = event.target.closest("[data-block-id]");
    if (!el) {
      dropTarget = { parentId: null, index: doc.blocks.length };
      return;
    }
    const f = findBlock(el.dataset.blockId);
    if (!f) return;
    const rect = el.getBoundingClientRect();
    const ratio = (event.clientY - rect.top) / rect.height;
    if (
      ["section", "buttons"].includes(f.block.type) &&
      ((ratio > 0.2 && ratio < 0.8) || !f.block.children.length)
    ) {
      dropTarget = { parentId: f.block.id, index: f.block.children.length };
      el.classList.add("bl-drop-inside");
    } else {
      const after = ratio > 0.5;
      dropTarget = { parentId: f.parentId, index: f.index + (after ? 1 : 0) };
      el.classList.add(after ? "bl-drop-after" : "bl-drop-before");
    }
  }
  function onFrameDrop(event) {
    const data = readDrag(event);
    if (!data) return;
    event.preventDefault();
    const destination = dropTarget || {
      parentId: null,
      index: doc.blocks.length,
    };
    clearDrop();
    dragData = null;
    if (data.source === "library") addBlock(data.type, destination);
    else moveTo(data.id, destination);

  function updateProp(key, value, rebuildInspector = false) {

        .replace(/[^a-z0-9_-]/gi, "")
        .slice(0, 80);

      key === "target" &&
      f.block.type === "countdown" &&
      Number.isFinite(new Date(value).getTime())

      value = new Date(value).toISOString();

      key === "count" &&
      f.block.type === "columns" &&
      flatten().length +

        400

      return;

      () => {
        if (key === "count" && f.block.type === "columns") {

  async function importImage(file) {
    if (!file) return;
    if (!/^image\/(png|jpeg|webp|gif|svg\+xml|avif)$/.test(file.type)) {
      toast("Choisissez une image PNG, JPEG, WebP, GIF, SVG ou AVIF.", true);
      return;
    }
    if (file.size > 10 * 1024 * 1024) {
      toast("Cette image est trop volumineuse (10 Mo maximum).", true);
      return;
    }
    const id = selectedId;
    try {
      const data = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      // Redimensionnement natif des photos pour limiter le poids du projet.
      const image = new Image();
      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = reject;
        image.src = data;
      });
      let src = data;
      if (file.type !== "image/gif" && file.type !== "image/svg+xml") {
        const ratio = Math.min(
          1,
          1800 / Math.max(image.naturalWidth, image.naturalHeight),
        );
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.naturalWidth * ratio));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * ratio));
        canvas
          .getContext("2d")
          .drawImage(image, 0, 0, canvas.width, canvas.height);
        src = canvas.toDataURL("image/webp", 0.88);
      }
      const f = findBlock(id);
      if (!f) return;
      commit(
        () => {
          f.block.props.src = src;
          f.block.props.alt = file.name
            .replace(/\.[^.]+$/, "")
            .replace(/[-_]/g, " ");
        },
        { delay: 0 },
      );
      toast("Image intégrée. Elle sera incluse dans le HTML.");
    } catch (error) {
      toast("Impossible de lire cette image. Essayez un autre fichier.", true);
    }
  }

  function download(content, filename, type = "text/plain;charset=utf-8") {
    const url = URL.createObjectURL(new Blob([content], { type }));
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }
  function saveProject() {
    saveNow();

      `${slug(doc.title)}.bloclibre.json`,

    );
    toast("Projet téléchargé. Gardez ce fichier pour reprendre l’édition.");
  }
  function exportHtml(fragment = false) {
    download(
      htmlDocument(doc, false, fragment),
      fragment ? "fragment.html" : "index.html",
      "text/html;charset=utf-8",

      fragment
        ? "Fragment HTML et CSS téléchargé."
        : "Votre page HTML est prête à être publiée.",
    );

  async function copyCode() {
    const text = htmlDocument(doc, false, modalExportMode === "fragment");
    let copied = false;
    try {
      await navigator.clipboard.writeText(text);
      copied = true;
    } catch (error) {
      const temp = document.createElement("textarea");
      temp.value = text;
      temp.style.cssText = "position:fixed;left:-9999px;top:0";
      document.body.append(temp);
      temp.select();
      try {
        copied = document.execCommand("copy");
      } catch (e) {
        /* fallback manuel */
      }
      temp.remove();
    }
    toast(
      copied
        ? "Code copié dans le presse-papiers."
        : "Copie indisponible ici. Téléchargez le HTML ou sélectionnez le code.",
      !copied,
    );
    if (copied) {
      const btn = $("#copy-code");
      if (btn) {
        btn.innerHTML = `${icon("check")}Copié !`;
        setTimeout(() => {
          if (btn.isConnected) btn.innerHTML = `${icon("copy")}Copier le code`;
        }, 2000);
      }
    }
  }
  async function readProjectFile(file) {
    if (!file) return;
    if (file.size > 20 * 1024 * 1024) {
      toast("Ce projet est trop volumineux (20 Mo maximum).", true);
      return;
    }
    try {
      const incoming = normalizeProject(JSON.parse(await file.text()));
      openConfirm(
        "Importer ce projet ?",
        `Le projet « ${incoming.title} » remplacera la page affichée. Vous pourrez annuler l’opération avec Ctrl/Cmd + Z.`,
        () => replaceProject(incoming, "Projet importé."),
        "Importer le projet",
      );
    } catch (error) {
      toast(
        error instanceof SyntaxError
          ? "Le fichier n’est pas un JSON valide. Importez un fichier .bloclibre.json."
          : error.message,
        true,
      );
    }
  }

  function handleKeys(event) {
    const mod = event.metaKey || event.ctrlKey,
      key = event.key.toLowerCase();
    const editable = event.target.closest?.(
      'input,textarea,select,[contenteditable="true"]',
    );
    if (key === "escape") {
      if (modalState) closeModal();
      closeMenu();
      closePanels();
      return;
    }
    if (modalState) {
      if (key === "tab") {
        const focusable = $$(
          'button:not(:disabled),[href],input,select,textarea,[tabindex="0"]',
          $(".modal"),
        );
        if (!focusable.length) return;
        const first = focusable[0],
          last = focusable.at(-1);
        if (
          event.shiftKey &&
          (document.activeElement === first ||
            document.activeElement === $(".modal"))
        ) {
          event.preventDefault();
          last.focus();
        } else if (
          !event.shiftKey &&
          (document.activeElement === last ||
            document.activeElement === $(".modal"))
        ) {
          event.preventDefault();
          first.focus();
        }
      }
      if (mod && key === "s") {
        event.preventDefault();
        saveProject();
      }
      return;
    }
    if (mod && key === "s") {
      event.preventDefault();
      saveProject();
      return;
    }
    if (mod && key === "z") {
      event.preventDefault();
      travelHistory(event.shiftKey ? 1 : -1);
      return;
    }
    if (mod && key === "y") {
      event.preventDefault();
      travelHistory(1);
      return;
    }
    if (mod && event.shiftKey && key === "e") {
      event.preventDefault();
      openModal("export");
      return;
    }
    if (editable) return;
    if (mod && key === "d" && selectedId) {
      event.preventDefault();
      duplicateBlock();
    }
    if (!mod && (key === "delete" || key === "backspace") && selectedId) {
      event.preventDefault();
      deleteBlock();
    }
    if (!mod && key === "/") {
      event.preventDefault();
      changeSidebarTab("blocks");
      if (matchMedia("(max-width:740px)").matches) openPanel("left");
      $("#block-search")?.focus();
    }
  }

      return;
    }
    const a = event.target.closest("[data-inspector-action]")?.dataset
      .inspectorAction;
    if (a === "save-project") saveProject();
    if (a === "import-project") $("#project-file-input").click();
    if (a === "about") openModal("about");
    if (a === "add-inside") {
      changeSidebarTab("blocks");
      if (matchMedia("(max-width:740px)").matches) openPanel("left");
      $("#block-search")?.focus();
      toast("Choisissez un bloc pour l’ajouter à cette section.");
    }
  });
  $("#project-menu").addEventListener("click", (event) => {
    const action =
      event.target.closest("[data-menu-action]")?.dataset.menuAction;
    if (!action) return;
    closeMenu();
    if (action === "save") saveProject();
    if (action === "import") $("#project-file-input").click();
    if (["templates", "shortcuts", "about"].includes(action)) openModal(action);
    if (action === "new") openModal("templates");
  });
  $("#project-file-input").addEventListener("change", (event) => {
    readProjectFile(event.target.files[0]);
    event.target.value = "";
  });
  document.addEventListener("click", (event) => {
    if (!event.target.closest(".project-heading")) closeMenu();
  });
  $("#modal-root").addEventListener("click", (event) => {
    if (
      event.target.classList.contains("modal-backdrop") ||
      event.target.closest("[data-close-modal]")
    ) {
      closeModal();
      return;
    }
    if (event.target.closest("[data-download-html]")) {
      exportHtml(modalState === "export" && modalExportMode === "fragment");
      return;
    }
    if (event.target.closest("#copy-code")) {
      copyCode();
      return;
    }
    const mode = event.target.closest("[data-export-mode]");
    if (mode) {
      modalExportMode = mode.dataset.exportMode;
      renderExportModal();
      return;
    }
    const preview = event.target.closest("[data-preview-device]");
    if (preview) {
      setPreviewDevice(preview.dataset.previewDevice);
      return;
    }
    const template = event.target.closest("[data-template]");
    if (template) {
      const name = template.dataset.template;
      createFromTemplate(name);
      return;
    }
    if (event.target.closest("[data-confirm]")) {
      const action = confirmAction;
      confirmAction = null;
      action?.();
    }
  });
  document.addEventListener("keydown", handleKeys);
  window.addEventListener("beforeunload", (event) => {
    clearTimeout(saveTimer);
    if (!studioReady) return;
    const data = deepClone(snapshotProject());
    data.updatedAt = Date.now();
    const checkpoint = saveCheckpoint(data);
    if (!checkpoint && studioHasUnsaved) {
      event.preventDefault();
      event.returnValue = "";
    }
    saveNow();
  });
  window.addEventListener("resize", () => {
    layoutCanvas();
    if (matchMedia("(min-width:1051px)").matches) closePanels();
  });
  new ResizeObserver(layoutCanvas).observe($("#canvas-scroll"));

  // ── Démarrage ─────────────────────────────────────────────────────────────
  updateMeta();
  historyControls();
  renderLibrary();
  renderInspector();
  renderSelectionToolbar();
  setDevice(device);
  renderCanvas();
  initStudio();
  if (loadWarning) setTimeout(() => toast(loadWarning, true), 800);
})();

    </script>
  </body>
</html>
